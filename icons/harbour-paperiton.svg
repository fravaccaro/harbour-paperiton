<?xml version="1.0" encoding="UTF-8"?>
<!-- The leaf outline is the launcher shape from the Jolla Sailfish Apps icon
     template (icon-launcher-template.svg), CC BY 3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 86 86">
  <defs>
    <path id="leaf" d="M84.277,0.3H43C19.417,0.3,0.3,19.418,0.3,43v41.277c0,0.786,0.637,1.423,1.423,1.423H43c23.583,0,42.7-19.118,42.7-42.7V1.723C85.7,0.937,85.063,0.3,84.277,0.3z"/>

    <!-- Paperless-ngx green, hue 128, dark at the blunt corner and lighter
         towards the point, along the diagonal the template gradients use. -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="0.7169" y1="85.2831" x2="85.2831" y2="0.7169">
      <stop offset="0" stop-color="#17541f"/>
      <stop offset="1" stop-color="#2fa84f"/>
    </linearGradient>

    <!-- A folded paper boat on a 140 x 104 box, so its centre is at 70,52:
         the sail runs from the apex down to the deck, the deck rises to a tip
         at each end, and the hull closes along the keel. -->
    <polygon id="boat" points="70,0 114,56 140,48 110,104 30,104 0,48 26,56"/>

    <!-- The two creases are cut out rather than drawn, so the boat keeps
         reading as one sheet of paper folded twice. -->
    <mask id="folds" maskUnits="userSpaceOnUse" x="-10" y="-10" width="160" height="124">
      <rect x="-10" y="-10" width="160" height="124" fill="#ffffff"/>
      <path d="M70 4V52" stroke="#000000" stroke-width="6"/>
      <path d="M24 56H116" stroke="#000000" stroke-width="6"/>
    </mask>
  </defs>

  <use xlink:href="#leaf" fill="url(#body)"/>

  <!-- Centred on the leaf: 70,52 of the boat lands on 43,43 of the icon. -->
  <g transform="translate(19.2 25.32) scale(0.34)">
    <g mask="url(#folds)">
      <use xlink:href="#boat" fill="#ffffff"/>
    </g>
  </g>
</svg>
