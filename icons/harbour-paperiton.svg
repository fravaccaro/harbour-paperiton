<?xml version="1.0" encoding="UTF-8"?>
<!-- The leaf outline is the launcher shape from the Jolla Sailfish Apps icon
     template (icon-launcher-template.svg), CC BY 3.0. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 86 86">
  <defs>
    <path id="leaf" d="M84.277,0.3H43C19.417,0.3,0.3,19.418,0.3,43v41.277c0,0.786,0.637,1.423,1.423,1.423H43c23.583,0,42.7-19.118,42.7-42.7V1.723C85.7,0.937,85.063,0.3,84.277,0.3z"/>

    <!-- Paperless-ngx green, hue 128, dark at the blunt corner and lighter
         towards the point, along the diagonal the template gradients use. -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse"
                    x1="0.7169" y1="85.2831" x2="85.2831" y2="0.7169">
      <stop offset="0" stop-color="#17541f"/>
      <stop offset="1" stop-color="#2fa84f"/>
    </linearGradient>

    <!-- A sheet with a folded corner and three lines of text, drawn on a 172
         canvas. Its bounding box runs 32,14 to 136,168, so the centre is at
         84,91. -->
    <g id="sheet" fill-rule="evenodd">
      <path d="M42 14h56a10 10 0 0 1 7.07 2.93l28 28A10 10 0 0 1 136 52v106a10 10 0 0 1-10 10H42a10 10 0 0 1-10-10V24a10 10 0 0 1 10-10zm0 14a4 4 0 0 0-4 4v126a4 4 0 0 0 4 4h84a4 4 0 0 0 4-4V58H98a8 8 0 0 1-8-8V28H42z"/>
      <rect x="52" y="74" width="64" height="9" rx="4.5"/>
      <rect x="52" y="96" width="64" height="9" rx="4.5"/>
      <rect x="52" y="118" width="40" height="9" rx="4.5"/>
    </g>
  </defs>

  <use xlink:href="#leaf" fill="url(#body)"/>

  <!-- Centred on the leaf: 84,91 of the sheet lands on 43,43 of the icon. -->
  <g transform="translate(15.28 12.97) scale(0.33)">
    <use xlink:href="#sheet" fill="#ffffff"/>
  </g>
</svg>
